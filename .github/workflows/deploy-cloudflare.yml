# Optional. You only need this if you'd rather deploy from Actions than use
# Cloudflare Pages' own Git integration.
#
# The Git integration (Cloudflare dashboard -> Workers & Pages -> Create ->
# Pages -> Connect to Git) is simpler: it needs no secrets and redeploys on
# every push by itself. Use this workflow only if you want deploys gated on CI,
# or you don't want to grant Cloudflare access to the repo.
#
# Requires two repository secrets:
#   CLOUDFLARE_API_TOKEN   - token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  - from the Cloudflare dashboard URL

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skip cleanly on forks and before the secrets exist, rather than failing red.
    if: github.repository == 'jsumnerp/optcg-prerelease-builder'
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify the card data is well-formed before shipping it
        run: |
          python3 - <<'PY'
          import json, sys
          d = json.load(open('data/cards_OP17.json'))['cards']
          assert len(d) > 100, f"only {len(d)} cards"
          missing = [c['id'] for c in d if c.get('cost') is None and c['category'] != 'LEADER']
          assert not missing, f"cards with no cost: {missing}"
          print(f"{len(d)} cards, {len([c for c in d if c['counter'] >= 2000])} with a 2000 counter")
          PY

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=optcg-prerelease-builder
