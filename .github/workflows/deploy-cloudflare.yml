# CI for every push, plus an *optional* manual deploy.
#
# Deploying from here is not the default. If you connected the repo in the
# Cloudflare dashboard (Workers & Pages -> Import a repository), Cloudflare
# already redeploys on every push and this workflow must not also deploy --
# two deploy paths racing on the same project is worse than one.
#
# So: the validation job runs on every push, and the deploy job only runs when
# you trigger it by hand AND the secrets exist. Without them it is skipped, not
# failed, so pushes stay green.
#
# To use the manual deploy, add two repository secrets:
#   CLOUDFLARE_API_TOKEN   - token with "Cloudflare Workers Scripts: Edit"
#   CLOUDFLARE_ACCOUNT_ID  - from the Cloudflare dashboard URL

name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Card data is well-formed
        run: |
          python3 - <<'PY'
          import json
          cards = json.load(open('data/cards_OP17.json'))['cards']
          assert len(cards) > 100, f"only {len(cards)} cards"

          bad_cost = [c['id'] for c in cards
                      if c.get('cost') is None and c['category'] != 'LEADER']
          assert not bad_cost, f"cards with no cost: {bad_cost}"

          # Every card must resolve to an image that exists in the repo.
          import os
          missing = [c['id'] for c in cards if not os.path.exists(c['image'])]
          assert not missing, f"cards with no image: {missing}"

          # A card with unknown text is a data gap, not a failure -- report it.
          unknown = [c['id'] for c in cards
                     if not c['effect'] and not c.get('vanilla')
                     and c['category'] != 'LEADER' and c['rarity'] != 'SP']

          n2k = len([c for c in cards if c['counter'] >= 2000])
          print(f"{len(cards)} cards · {n2k} with a 2000 counter · "
                f"{len(unknown)} with unknown text {unknown}")
          PY

  deploy:
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      HAS_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip notice
        if: env.HAS_SECRETS != 'true'
        run: |
          echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set — skipping deploy."
          echo "If Cloudflare's Git integration is connected, that is expected: it deploys on its own."
      - uses: cloudflare/wrangler-action@v3
        if: env.HAS_SECRETS == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
